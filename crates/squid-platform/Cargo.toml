[package]
name = "squid-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OS adapters for squid: apps, leftovers, volumes and lifecycle hooks"

[dependencies]
squid-core.workspace = true
serde.workspace = true
libc.workspace = true
dirs.workspace = true
walkdir.workspace = true
plist.workspace = true
rayon.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
sysinfo.workspace = true
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
