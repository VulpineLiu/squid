[package]
name = "squid-desktop"
version = "0.1.13"
description = "Squid — a CleanMyMac-inspired cleaner, uninstaller and system monitor."
authors = ["squid contributors"]
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-only"
default-run = "squid-desktop"

[lib]
name = "squid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "squid-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
squid-core = { path = "../crates/squid-core" }
squid-engine = { path = "../crates/squid-engine" }
squid-platform = { path = "../crates/squid-platform" }
squid-stats = { path = "../crates/squid-stats" }
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast"] }
globset = "0.4"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
