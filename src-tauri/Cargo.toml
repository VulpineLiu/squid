[package]
name = "squid-desktop"
version = "0.1.14"
description = "Squid — a CleanMyMac-inspired cleaner, uninstaller and system monitor."
authors = ["mula.liu"]
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/VulpineLiu/squid"
homepage = "https://github.com/VulpineLiu/squid"
default-run = "squid-desktop"

[lib]
name = "squid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "squid-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
squid-core = { path = "../crates/squid-core" }
squid-engine = { path = "../crates/squid-engine" }
squid-platform = { path = "../crates/squid-platform" }
squid-guard = { path = "../crates/squid-guard" }
squid-stats = { path = "../crates/squid-stats" }
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast"] }
globset = "0.4"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# The workspace root declares these for `crates/*`, but `src-tauri` is excluded
# from that workspace, so this package had no release profile of its own and every
# desktop build shipped its whole symbol table. `strip = true` would only have
# dropped debug info, which this binary does not carry; the 23 MB that came out of
# it was the symbol table, so it is the symbol table that has to go.
# `panic` is deliberately left to unwind: a panic on a command thread currently
# costs one request, and aborting the whole app instead would be a behaviour change
# this release has no business making.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
